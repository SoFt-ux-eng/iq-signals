name: reversal-alert

on:

  schedule:

    - cron: "*/5 7-17 * * *"   # every 5 min, 07:00-17:59 UTC, every day

  workflow_dispatch:

concurrency:

  group: reversal-alert

  cancel-in-progress: false

jobs:

  run:

    runs-on: ubuntu-latest

    timeout-minutes: 6

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - run: pip install requests git+https://github.com/iqoptionapi/iqoptionapi.git

      - run: python reversal_alert.py --for 285

        env:

          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}

          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}


